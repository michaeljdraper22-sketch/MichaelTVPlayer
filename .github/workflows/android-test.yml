# Cloud emulator test for the Android app.
#
# Local Windows emulators all need admin-level drivers, but GitHub's
# ubuntu runners expose /dev/kvm — so the app is tested on a real
# headless Android emulator here. The runner BUILDS an x86_64 debug APK
# from HEAD first (tests HEAD natively; the release APK is arm64-only).
#
# Historical note: the 2.1.1-era "playback blocked on the emulator"
# was NOT ARM translation and not codecs — the Big Buck Bunny sample
# URL (commondatastorage gtv-videos-bucket) now returns 403 Forbidden.
# Playback legs now use verified-live public URLs in two codecs
# (H.264 mp4 + VP9 webm); either advancing proves the pipeline.
#
# Drive: home (first-run setup banner), Settings, Live TV, search,
# playback via autoplay_test_url. Every leg re-focuses the app task
# (Play Services hiccups on the emulator kill bound apps) and waits
# until its screen's text appears in the accessibility dump. Fail
# loudly on any Chaquopy/PyException in logcat or on screen.

name: Android emulator test

on:
  workflow_dispatch:

concurrency:
  group: android-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure SDK packages for the build
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            > /dev/null

      - name: Build x86_64 debug APK (native, no ARM translation)
        run: |
          cd android-gradle
          # The release APK is arm64-only (ndk abiFilters in
          # app/build.gradle); switch the ABI for this test build so the
          # app AND its WebView media stack run natively on the x86_64
          # image. The 2.1.1 release-APK runs failed playback right at
          # media init under ARM translation.
          sed -i 's/abiFilters "arm64-v8a"/abiFilters "x86_64"/' app/build.gradle
          grep -n "abiFilters" app/build.gradle
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          python3 prepare_core.py
          curl -fsSL -o /tmp/gradle-8.4-bin.zip \
            https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q /tmp/gradle-8.4-bin.zip -d /tmp/gradle-dist
          mkdir -p ../artifacts
          /tmp/gradle-dist/gradle-8.4/bin/gradle --no-daemon --console=plain \
            -p . :app:assembleDebug -PbuildPython="$(command -v python3)"
          cp app/build/outputs/apk/debug/app-debug.apk \
            ../artifacts/MichaelTV-x86_64-debug.apk
          ls -la ../artifacts/

      - name: Install emulator + system image
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "emulator" "system-images;android-34;google_apis;x86_64" \
            > /dev/null

      - name: Create AVD
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd \
            -n michaeltv -k "system-images;android-34;google_apis;x86_64" -d pixel_5

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" list avd | head -12

      - name: Boot headless emulator
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          test -e /dev/kvm || { echo 'ERROR: /dev/kvm missing on runner'; exit 1; }
          sudo chown -R $USER:$USER /dev/kvm || true
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd michaeltv \
            -no-window -gpu swiftshader_indirect -no-boot-anim \
            -no-snapshot -memory 3072 > /tmp/emulator.log 2>&1 &
          # wait-for-device has NO timeout of its own and hangs forever if
          # the emulator process died — bound it, and keep the log either way.
          timeout 300 "$ANDROID_SDK_ROOT/platform-tools/adb" wait-for-device \
            || { echo 'ERROR: emulator never came up on adb'; tail -60 /tmp/emulator.log; exit 1; }
          BOOT=""
          for i in $(seq 1 90); do
            BOOT=$("$ANDROID_SDK_ROOT/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            sleep 5
          done
          [ "$BOOT" = "1" ] || { echo 'ERROR: boot did not complete'; tail -60 /tmp/emulator.log; exit 1; }
          echo "emulator booted"

      - name: Install APK
        run: |
          "$ANDROID_SDK_ROOT/platform-tools/adb" install -r artifacts/MichaelTV-x86_64-debug.apk

      - name: Drive the app
        run: |
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          export ADB="$ADB"
          mkdir -p artifacts/shots
          { "$ADB" shell wm size; "$ADB" shell wm density; } \
            > artifacts/screen.txt 2>&1 || true

          # Two hard-won facts about WebView + uiautomator dumps:
          # 1. right after a cold start the WebView exposes only a bare
          #    NAF node — the DOM reaches the accessibility tree with a
          #    delay (a previous run's first dump after a restart was
          #    empty while a later one had full text). So never dump
          #    once at a fixed sleep: re-dump until the expected text
          #    appears (wait_text), screenshot only after that.
          # 2. the app process can be killed mid-drive out of nowhere:
          #    logcat shows ActivityManager killing it because it
          #    "depends on provider com.google.android.gms/...
          #    FontsProvider in dying proc com.google.android.gms" —
          #    when Play Services hiccups on the emulator, every app
          #    bound to its font provider dies with it. This is the
          #    historical "04_search shows the launcher" flakiness. So
          #    every retry iteration RE-FOCUSES the app (am start
          #    relaunches a dead task, no-ops a live one) and asserts
          #    only on text that exists solely inside the app's WebView
          #    ("Live TV" etc — never "MichaelTV", which also matches
          #    the launcher's icon label).
          focus() {
            "$ADB" shell am start -n org.michaeltv.app/.MainActivity > /dev/null
            sleep 2
          }
          dump() {
            # file-based dump: piping `exec-out uiautomator dump
            # /dev/tty` silently swallows uiautomator's "could not get
            # idle state" failures (which leave a bare one-node tree —
            # the empty dumps that looked like a missing DOM). Going
            # via /sdcard + pull lets us drop the stale file first and
            # log the failure, so wait_text can retry meaningfully.
            "$ADB" shell rm -f /sdcard/uidump.xml > /dev/null 2>&1 || true
            "$ADB" shell uiautomator dump /sdcard/uidump.xml \
              > /tmp/uidump.log 2>&1 || true
            "$ADB" pull /sdcard/uidump.xml /tmp/uidump.xml \
              > /dev/null 2>&1 || true
            if [ -s /tmp/uidump.xml ]; then
              tr -d "\r" < /tmp/uidump.xml \
                | sed -e "s/UI hierchary.*//" > "artifacts/$1.xml"
            else
              : > "artifacts/$1.xml"
              echo "dump: uiautomator failed for $1:" \
                "$(tail -1 /tmp/uidump.log 2>/dev/null)"
            fi
          }
          shot() { "$ADB" exec-out screencap -p > "artifacts/shots/$1.png"; }
          wait_text() {
            # wait_text <dump-name> <must-appear-text>
            local i
            for i in $(seq 1 15); do
              focus
              dump "$1"
              grep -q "$2" "artifacts/$1.xml" && return 0
              sleep 3
            done
            echo "ASSERT FAIL: '$2' not on screen in $1"
            exit 1
          }
          tapr() {
            # tap by visible text, refocusing + retrying while the DOM
            # is still missing from the accessibility tree or the app
            # was killed
            local i
            for i in 1 2 3 4 5; do
              focus
              python3 scripts/tap_text.py "$1" && return 0
              sleep 3
            done
            echo "TAP FAIL: '$1' never found on screen"
            return 1
          }

          # --- leg 1: home. Fresh install (no keyed addon, no Xtream):
          # the first-run setup banner MUST explain itself ("torrentio.
          # strem.fun" appears on the home screen ONLY inside the banner). ---
          focus
          wait_text 01_home "Live TV"
          wait_text 01_home "torrentio.strem.fun"
          shot 01_home

          # --- leg 2: settings ---
          focus
          tapr "Settings"
          wait_text 02_settings "Stream addon URLs"
          shot 02_settings

          # --- leg 3: live TV without Xtream creds → friendly prompt ---
          "$ADB" shell input keyevent 4; sleep 2
          focus
          tapr "Live TV"
          wait_text 03_livetv "No Xtream account configured"
          shot 03_livetv

          # --- leg 4: search (focus field, type, VERIFY text landed) ---
          "$ADB" shell input keyevent 4; sleep 2
          # The query field is exposed as an EditText with empty text
          # (its placeholder is NOT in the a11y tree, so text-based
          # tapping cannot focus it). Observed bounds on this AVD
          # (1080x2340 @440dpi): [35,347][811,457] — tap the center.
          # Note the +136px status-bar offset when deriving coordinates
          # from CSS layout math.
          typed=0
          for round in 1 2 3 4 5; do
            focus
            "$ADB" shell input tap 420 400
            sleep 2
            "$ADB" shell input text "bluey"
            sleep 2
            # a single dump right after typing often comes back empty
            # (uiautomator idle-timeout while the IME settles) — the
            # text may still have landed, so re-dump patiently before
            # concluding it didn't and retyping
            for d in 1 2 3 4; do
              dump 04_typed
              grep -q "bluey" artifacts/04_typed.xml && { typed=1; break; }
              sleep 2
            done
            [ "$typed" = "1" ] && break
            echo "search leg: 'bluey' not visible yet (round $round)"
          done
          [ "$typed" = "1" ] || { echo "ASSERT FAIL: query never landed in the search field"; exit 1; }
          tapr "Search"
          wait_text 04_search "Bluey"
          shot 04_search

          # --- playback legs: public sample videos, no credentials.
          # Two codecs: H.264 mp4 (what debrid/Torrentio actually
          # serves) and VP9 webm (open codec every chromium supports).
          # Either advancing proves the pipeline (autoplay_test_url →
          # <video> → frames on screen); if only webm advances, the
          # image's WebView lacks proprietary codecs — real phones'
          # updatable WebViews have both. ---
          "$ADB" root > /dev/null 2>&1; sleep 3
          playback_probe() {
            # playback_probe <label> <url>: relaunch the app on the URL
            # via autoplay_test_url, wait for the player screen, grab
            # two frames 12 s apart
            local label="$1" url="$2"
            "$ADB" shell am force-stop org.michaeltv.app
            cat > /tmp/settings.json << JSON
          {
            "addons": ["https://torrentio.strem.fun"],
            "resolution_pref": "1080",
            "size_demote_gb": 0,
            "xtream_server": "",
            "xtream_username": "",
            "xtream_password": "",
            "autoplay_test_url": "$url"
          }
          JSON
            "$ADB" push /tmp/settings.json /data/data/org.michaeltv.app/files/settings.json
            "$ADB" shell am start -n org.michaeltv.app/.MainActivity
            wait_text "05_$label" "external player"
            shot "05_${label}_a"
            sleep 12
            shot "05_${label}_b"
          }
          playback_probe h264 "https://mdn.github.io/shared-assets/videos/flower.mp4"
          playback_probe vp9 "https://upload.wikimedia.org/wikipedia/commons/transcoded/8/87/Schlossbergbahn.webm/Schlossbergbahn.webm.480p.vp9.webm"

      - name: Collect logcat and verdict
        if: always()
        run: |
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          "$ADB" logcat -d > artifacts/logcat.txt || true
          cp /tmp/emulator.log artifacts/emulator.log 2>/dev/null || true
          echo === PY EXCEPTIONS ===
          grep -iE "PyException|chaquopy.*error|FATAL" artifacts/logcat.txt | head -20 || true
          echo === SCREEN ERRORS ===
          grep -l -iE "java com.chaquo|not callable" artifacts/*.xml 2>/dev/null || true
          # Fail if any python exception reached the UI or logcat.
          ! grep -qiE "PyException|not callable" artifacts/logcat.txt artifacts/*.xml 2>/dev/null

      - name: Playback verdict
        if: always()
        run: |
          advanced=""
          for codec in h264 vp9; do
            a="artifacts/shots/05_${codec}_a.png"
            b="artifacts/shots/05_${codec}_b.png"
            if [ -f "$a" ] && [ -f "$b" ]; then
              if cmp -s "$a" "$b"; then
                echo "playback $codec: frames identical - no advance"
              else
                echo "playback $codec: ADVANCED (frames differ)"
                advanced="$codec"
              fi
            else
              echo "playback $codec: screenshots missing"
            fi
          done
          if [ -z "$advanced" ]; then
            echo "FAIL: no sample video advanced in either codec"
            exit 1
          fi
          echo "playback verified via $advanced"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
